# CrownJukebox — Portainer Stack (single container)
# Deploy in Portainer: Stacks -> Add Stack -> Web editor
version: "3.9"

services:
  crownjukebox:
    image: ghcr.io/kronborgs/crownjukebox:main
    restart: unless-stopped
    ports:
      - "3000:80"  # Access via http://<server-ip>:3000
    environment:
      DB_PATH: /data/crownjukebox.db
      MUSIC_DIR: /music
      ARTWORK_CACHE_DIR: /artwork_cache
      SESSION_TTL_HOURS: "168"
      JWT_SECRET: change_this_secret  # Change this
      ALLOWED_ORIGINS: "*"
      # One-time FULL DB reset (optional): set to CONFIRM for one start,
      # then remove it again. Deletes the database file and starts from scratch.
      # RESET_SETUP_ON_START: "CONFIRM"
      # Optional Subsonic/Navidrome integration
      # SUBSONIC_URL: "http://navidrome:4533"
      # SUBSONIC_USERNAME: "admin"
      # SUBSONIC_PASSWORD: "password"
    volumes:
      - crownjukebox_db:/data
      - /mnt/user/music:/music:ro
      - crownjukebox_artwork:/artwork_cache

volumes:
  crownjukebox_db:
  crownjukebox_artwork:
