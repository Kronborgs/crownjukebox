version: "3.9"

services:
  crownjukebox:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/kronborgs/crownjukebox:main
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    environment:
      DB_PATH:            /data/crownjukebox.db
      MUSIC_DIR:          /music
      ARTWORK_CACHE_DIR:  /artwork_cache
      SESSION_TTL_HOURS:  "168"
      ADMIN_USERNAME:     ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD:     ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      JWT_SECRET:         ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ALLOWED_ORIGINS:    ${ALLOWED_ORIGINS:-*}
    volumes:
      - db_data:/data
      - ${MUSIC_DIR:-./music}:/music:ro
      - artwork_cache:/artwork_cache
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/api/playback/state"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  db_data:
  artwork_cache:
